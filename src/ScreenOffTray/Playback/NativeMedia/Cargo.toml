[package]
name = "screenoff_media"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "=0.62.2", features = ["Media_Control", "Win32_System_WinRT", "Win32_System_Threading"] }
windows-future = "0.3"

[profile.release]
panic = "abort"
strip = "symbols"
